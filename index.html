<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtmoPulse – Real-Time Global Weather &amp; RESTful API Dashboard</title>
    <meta
      name="description"
      content="Real-time global weather dashboard built with modern asynchronous JavaScript, Fetch API, and Open-Meteo REST API. Accurate live temperature, humidity, wind, and forecast metrics."
    />
    <meta name="keywords" content="Weather Dashboard, REST API, Async JavaScript, Fetch API, Open-Meteo, Live Forecast, Humidity, Wind Speed" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />

    <!-- OpenGraph Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AtmoPulse Weather" />
    <meta property="og:title" content="AtmoPulse – Real-Time Global Weather Dashboard" />
    <meta
      property="og:description"
      content="Live meteorological data, 24-hour trends, 7-day forecasts, and air quality metrics powered by asynchronous RESTful APIs."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AtmoPulse – Real-Time Global Weather Dashboard" />
    <meta
      name="twitter:description"
      content="Accurate real-time weather metrics, live search by city, and nested JSON data visualization."
    />

    <!-- Structured Data (JSON-LD) for WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "AtmoPulse Weather Dashboard",
      "applicationCategory": "WeatherApplication",
      "operatingSystem": "All",
      "description": "Real-time weather metrics and multi-day forecasts fetched via asynchronous RESTful APIs.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
